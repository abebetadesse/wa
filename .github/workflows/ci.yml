name: CI / CD

# CD: on main, the release is built here on Linux and published to the plesk-release branch.
# The hosting server cannot compile the app (its glibc is too old for the Next.js compiler), so it
# only pulls that pre-built branch through Plesk → Git. Optional, in Settings → Secrets and
# variables → Actions:
#   secret   PLESK_GIT_WEBHOOK_URL  Webhook URL of the Plesk Git repository that deploys the
#                                   plesk-release branch. When set, the server pulls each new
#                                   release right away; otherwise click Deploy in Plesk → Git.
#                                   (The older PLESK_DEPLOY_WEBHOOK secret is deliberately unused:
#                                   it may point at a deployment of main, which cannot build.)
#   variable HEALTH_URL             Checked after deployment
#                                   (default https://app.wisdomcourse.com.et/api/health).
# Running this workflow by hand on any other branch builds the release without publishing it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: ethio_wellness
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:ci-only@127.0.0.1:3306/ethio_wellness
    steps:
      # The supplied-book PDFs (Git LFS, ~324 MB) are not needed to check or build the app.
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Database builds from scratch
        run: npm run db:setup
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Bundle budget (JavaScript phones download)
        run: node scripts/bundle-budget.mjs

  deploy:
    name: Publish release (CD)
    needs: verify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: ethio_wellness
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Build-time database only; nothing from this job's environment is shipped.
      DATABASE_URL: mysql://root:ci-only@127.0.0.1:3306/ethio_wellness
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
      WEBHOOK_URL: ${{ secrets.PLESK_GIT_WEBHOOK_URL }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'https://app.wisdomcourse.com.et/api/health' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare the build database
        run: npm run db:setup
      - name: Production build
        run: npm run build
      - name: Assemble the release on the plesk-release branch
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Continue the branch's history when it exists.
          git fetch --no-tags origin plesk-release:refs/heads/plesk-release || true
          node scripts/prepare-plesk.mjs --branch plesk-release --no-zip
          jq . plesk-release/RELEASE.json
      - name: Publish the release
        run: |
          set -Eeuo pipefail
          if [[ "$PUBLISH" != "true" ]]; then
            echo "::notice title=Dry run::Release built from ${GITHUB_REF_NAME} but not published; only main publishes."
            exit 0
          fi
          git push origin refs/heads/plesk-release:refs/heads/plesk-release
      - name: Trigger the server to pull it
        id: trigger
        run: |
          set -Eeuo pipefail
          if [[ "$PUBLISH" != "true" ]]; then
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$WEBHOOK_URL" ]]; then
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release published::The plesk-release branch is updated. Click Deploy in Plesk → Git, or add the PLESK_GIT_WEBHOOK_URL secret to deploy automatically."
            exit 0
          fi
          if curl --silent --show-error --fail --max-time 60 --request POST "$WEBHOOK_URL" --output /dev/null; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Server not reached::The Plesk webhook did not answer from GitHub. The release is published; click Deploy in Plesk → Git."
            exit 1
          fi
      - name: Verify the live site runs this release
        if: steps.trigger.outputs.triggered == 'true'
        run: |
          set -Eeuo pipefail
          EXPECTED="$(jq -r .commit plesk-release/RELEASE.json)"
          for attempt in $(seq 1 40); do
            if curl --silent --max-time 10 "$HEALTH_URL" --output health.json; then
              STATUS="$(jq -r '.status // "unknown"' health.json 2>/dev/null || echo unknown)"
              RUNNING="$(jq -r '.release.commit // "none"' health.json 2>/dev/null || echo none)"
              echo "Attempt $attempt/40: status=$STATUS release=$RUNNING (expecting $EXPECTED)"
              if [[ "$STATUS" == "ok" && "$RUNNING" == "$EXPECTED" ]]; then
                echo "Live site is healthy and runs $EXPECTED."
                exit 0
              fi
            else
              echo "Attempt $attempt/40: no response yet."
            fi
            sleep 15
          done
          echo "::error::$HEALTH_URL did not report a healthy $EXPECTED release within 10 minutes."
          cat health.json 2>/dev/null || true
          exit 1
