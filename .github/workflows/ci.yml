name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: ethio_wellness
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:ci-only@127.0.0.1:3306/ethio_wellness
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Database builds from scratch
        run: npm run db:setup
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  deploy:
    name: Live Deployment (CD)
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      _SSH_HOST: ${{ secrets.SSH_HOST }}
      _SSH_USER: ${{ secrets.SSH_USER }}
      _SSH_KEY: ${{ secrets.SSH_KEY }}
      _SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      _SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      _SSH_PORT: ${{ secrets.SSH_PORT }}
      _DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      _NODE_BIN_DIR: ${{ secrets.NODE_BIN_DIR }}
      _APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Deploy, migrate, and seed production
        run: |
          set -Eeuo pipefail

          KEY="${_SSH_KEY:-$_SSH_PRIVATE_KEY}"
          if [[ -z "$_SSH_HOST" || -z "$_SSH_USER" || -z "$KEY" || -z "$_SSH_KNOWN_HOSTS" || -z "$_DEPLOY_PATH" ]]; then
            echo "::error::Configure SSH_HOST, SSH_USER, SSH_PRIVATE_KEY (or SSH_KEY), SSH_KNOWN_HOSTS, and DEPLOY_PATH in repository Actions secrets."
            exit 1
          fi
          if [[ ! "$_SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ || ! "$_SSH_USER" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::SSH_HOST and SSH_USER must be a hostname/IP and a simple account name."
            exit 1
          fi

          PORT="${_SSH_PORT:-22}"
          if [[ ! "$PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::SSH_PORT must be a port number."
            exit 1
          fi

          umask 077
          KEY_FILE="$(mktemp)"
          KNOWN_HOSTS_FILE="$(mktemp)"
          SCRIPT_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE" "$KNOWN_HOSTS_FILE" "$SCRIPT_FILE"' EXIT
          printf '%s\n' "$KEY" > "$KEY_FILE"
          printf '%s\n' "$_SSH_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"

          {
            printf 'APP_DIR=%q\n' "$_DEPLOY_PATH"
            printf 'DEPLOY_SHA=%q\n' "$GITHUB_SHA"
            printf 'NODE_BIN_DIR=%q\n' "${_NODE_BIN_DIR:-/opt/plesk/node/22/bin}"
            cat <<'REMOTE'
          set -Eeuo pipefail
          cd "$APP_DIR"
          test -d .git || { echo "DEPLOY_PATH must be an existing Git checkout." >&2; exit 1; }
          git fetch --no-tags origin main
          git checkout --detach "$DEPLOY_SHA"
          git lfs pull
          export PATH="$NODE_BIN_DIR:$PATH"
          node --version
          npm --version
          npm ci --include=dev --prefer-offline
          npm run db:setup
          npm run build
          npm prune --omit=dev
          mkdir -p tmp
          touch tmp/restart.txt
          echo "Deployment finished for $DEPLOY_SHA."
          REMOTE
          } > "$SCRIPT_FILE"

          ssh \
            -i "$KEY_FILE" \
            -p "$PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            "${_SSH_USER}@${_SSH_HOST}" \
            'bash -s' < "$SCRIPT_FILE"

      - name: Verify live health
        env:
          HEALTH_BASE_URL: ${{ secrets.APP_URL }}
        run: |
          set -Eeuo pipefail
          BASE_URL="${HEALTH_BASE_URL:-https://app.wisdomcourse.com.et}"
          HEALTH_URL="${BASE_URL%/}/api/health"
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          for attempt in $(seq 1 24); do
            if curl --silent --max-time 10 "$HEALTH_URL" --output "$RESPONSE_FILE"; then
              STATUS="$(jq -r '.status // "unknown"' "$RESPONSE_FILE" 2>/dev/null || echo unknown)"
              echo "Health check $attempt/24: $STATUS"
              if [[ "$STATUS" == "ok" ]]; then
                echo "Live deployment is healthy."
                exit 0
              fi
            else
              echo "Health check $attempt/24: no response yet."
            fi
            sleep 5
          done

          echo "::error::Live deployment did not become healthy at $HEALTH_URL."
          exit 1
