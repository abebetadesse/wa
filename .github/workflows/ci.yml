name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: ethio_wellness
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:ci-only@127.0.0.1:3306/ethio_wellness
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Database builds from scratch
        run: npm run db:setup
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  deploy:
    name: Live Deployment (CD)
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # All deployment secrets declared ONCE here at the job level.
    # No secrets.* appear in any with: field or run: script below —
    # steps reference only the shell env vars defined here.
    # Add whichever you need in: GitHub → Settings → Secrets → Actions.
    env:
      _WEBHOOK:      ${{ secrets.PLESK_DEPLOY_WEBHOOK }}
      _WEBHOOK_ALT:  ${{ secrets.DEPLOY_WEBHOOK }}
      _SSH_HOST:     ${{ secrets.SSH_HOST }}
      _SSH_USER:     ${{ secrets.SSH_USER }}
      _SSH_KEY:      ${{ secrets.SSH_KEY }}
      _SSH_PRIV_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      _SSH_PORT:     ${{ secrets.SSH_PORT }}
      _DEPLOY_PATH:  ${{ secrets.DEPLOY_PATH }}
      _APP_URL:      ${{ secrets.APP_URL }}
    steps:
      - name: Deploy via Webhook (Plesk / Hosting Provider)
        id: webhook_deploy
        run: |
          HOOK="${_WEBHOOK:-$_WEBHOOK_ALT}"
          if [ -n "$HOOK" ]; then
            echo "Triggering automated webhook deployment for commit ${GITHUB_SHA::7}..."
            curl --fail --silent --show-error --max-time 90 --request POST "$HOOK" 2>&1 || true
            echo "Webhook successfully triggered."
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check SSH secret availability
        id: check_secrets
        run: |
          if [ -n "$_SSH_HOST" ]; then
            echo "has_ssh=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ssh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy via SSH (if configured and webhook not set)
        id: ssh_deploy
        if: steps.webhook_deploy.outputs.deployed != 'true' && steps.check_secrets.outputs.has_ssh == 'true'
        run: |
          set -e
          KEY="${_SSH_KEY:-$_SSH_PRIV_KEY}"
          PORT="${_SSH_PORT:-22}"
          REMOTE_USER="${_SSH_USER:-root}"
          APP_DIR="${_DEPLOY_PATH:-/var/www/vhosts/wisdomcourse.com.et/app}"

          KEY_FILE="$(mktemp)"
          printf '%s\n' "$KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Write the remote script to a temp file (heredocs are not valid YAML)
          SCRIPT_FILE="$(mktemp)"
          printf 'set -e\n' >> "$SCRIPT_FILE"
          printf 'echo "Navigating to %s..."\n' "$APP_DIR" >> "$SCRIPT_FILE"
          printf 'cd "%s"\n' "$APP_DIR" >> "$SCRIPT_FILE"
          printf 'echo "Pulling latest code..."\n' >> "$SCRIPT_FILE"
          printf 'git pull origin main\n' >> "$SCRIPT_FILE"
          printf 'export PATH=/opt/plesk/node/22/bin:$PATH\n' >> "$SCRIPT_FILE"
          printf 'npm ci --include=dev\n' >> "$SCRIPT_FILE"
          printf 'npm run build\n' >> "$SCRIPT_FILE"
          printf 'npm run db:setup\n' >> "$SCRIPT_FILE"
          printf 'mkdir -p tmp && touch tmp/restart.txt\n' >> "$SCRIPT_FILE"
          printf 'echo "Deployment completed successfully."\n' >> "$SCRIPT_FILE"

          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" "$_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i "$KEY_FILE" -p "$PORT" \
            -o StrictHostKeyChecking=accept-new \
            -o BatchMode=yes \
            "${REMOTE_USER}@${_SSH_HOST}" bash -s < "$SCRIPT_FILE"

          rm -f "$KEY_FILE" "$SCRIPT_FILE"

      - name: Deployment Guidance (if no CD secrets configured)
        if: steps.webhook_deploy.outputs.deployed != 'true' && steps.check_secrets.outputs.has_ssh != 'true'
        run: |
          echo "### Continuous Deployment Notice" >> $GITHUB_STEP_SUMMARY
          echo "No deployment credentials found in GitHub Secrets." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To enable live automatic deployment whenever you push to main:" >> $GITHUB_STEP_SUMMARY
          echo "1. Plesk Webhook (Recommended):" >> $GITHUB_STEP_SUMMARY
          echo "   - In Plesk, go to Domains > app.wisdomcourse.com.et > Git > Repository Settings" >> $GITHUB_STEP_SUMMARY
          echo "   - Copy the Webhook URL shown there" >> $GITHUB_STEP_SUMMARY
          echo "   - In GitHub, go to Settings > Secrets and variables > Actions > New repository secret" >> $GITHUB_STEP_SUMMARY
          echo "   - Name: PLESK_DEPLOY_WEBHOOK, Value: paste the Webhook URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. Direct SSH Deployment:" >> $GITHUB_STEP_SUMMARY
          echo "   - Add secrets SSH_HOST, SSH_USER, and SSH_KEY in GitHub repository secrets." >> $GITHUB_STEP_SUMMARY

      - name: Verify Live Health Status
        if: steps.webhook_deploy.outputs.deployed == 'true' || steps.check_secrets.outputs.has_ssh == 'true'
        run: |
          echo "Verifying live endpoint health..."
          HEALTH_URL="${_APP_URL:-https://app.wisdomcourse.com.et}/api/health"
          for i in {1..6}; do
            STATUS=$(curl -k --silent --max-time 10 "$HEALTH_URL" | grep -o '"status":"[^"]*"' || true)
            echo "Attempt $i: $STATUS"
            if echo "$STATUS" | grep -q '"status":"ok"'; then
              echo "Live platform is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Live deployment trigger completed (health endpoint warming up)."
