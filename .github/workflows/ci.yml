name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # A throwaway MySQL 8 that exists only for this run.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: ethio_wellness
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: mysql://root:ci-only@127.0.0.1:3306/ethio_wellness
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No known vulnerabilities in what ships
        run: npm audit --omit=dev --audit-level=high
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Database builds from scratch
        run: npm run db:setup
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build

  # Asks Plesk to pull and deploy, only after every check above has passed on main.
  # Needs one repository secret, PLESK_DEPLOY_WEBHOOK (the "Webhook URL" shown in Plesk → Git →
  # repository settings). Without it this job does nothing. Production settings such as
  # DATABASE_URL or AUTH_SECRET never belong here: they live in .env on the server.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the Plesk deployment
        env:
          PLESK_DEPLOY_WEBHOOK: ${{ secrets.PLESK_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$PLESK_DEPLOY_WEBHOOK" ]; then
            echo "PLESK_DEPLOY_WEBHOOK is not set: skipping. Deploy from Plesk → Git instead."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 --request POST --output /dev/null "$PLESK_DEPLOY_WEBHOOK"
          echo "Plesk was asked to deploy ${GITHUB_SHA::7}. Follow the result in Plesk → Git."
